stages:
  - Syntax Check

variables:
  GIT_DEPTH: 1 # No need to bring the whole history
  COLUMNS: 150

  GL_PIPELINE_NAME: 'Dry run test on $CI_COMMIT_BRANCH'
  PCVS_CMD: pcvs run -p local:profile:ci --dry-run -S

workflow:
  name: '$GL_PIPELINE_NAME'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        GL_PIPELINE_NAME: '$CI_MERGE_REQUEST_TITLE'

default:
  interruptible: true

before_script:
  - source "$(ccc_home -u mpc)/gitlab-runner/spack_organizer_inti/setup.sh"
  - spack env activate mpc-runner-deps
  - module load mpi
  - export PATH=$PATH:${CI_BUILDS_DIR}/bin

Create HIP Mock:
  stage: '.pre'
  needs: []
  script:
    - mkdir -p ${CI_BUILDS_DIR}/bin 
    - echo "#!/bin/sh" > ${CI_BUILDS_DIR}/bin/hipcc 
    - chmod +x ${CI_BUILDS_DIR}/bin/hipcc

Dry Run Hybrid:
  stage: 'Syntax Check'
  needs: ['Create HIP Mock']
  script:
    - cp -r ${CI_PROJECT_DIR}/.gitlab/.pcvs ${CI_PROJECT_DIR}
    - ${PCVS_CMD} Hybrid

Dry Run MPI:
  stage: 'Syntax Check'
  needs: ['Create HIP Mock']
  script:
    - cp -r ${CI_PROJECT_DIR}/.gitlab/.pcvs ${CI_PROJECT_DIR}
    - ${PCVS_CMD} MPI

Dry Run OpenMP:
  stage: 'Syntax Check'
  needs: ['Create HIP Mock']
  script:
    - cp -r ${CI_PROJECT_DIR}/.gitlab/.pcvs ${CI_PROJECT_DIR}
    - ${PCVS_CMD} OpenMP

Dry Run Threads:
  stage: 'Syntax Check'
  needs: ['Create HIP Mock']
  script:
    - cp -r ${CI_PROJECT_DIR}/.gitlab/.pcvs ${CI_PROJECT_DIR}
    - ${PCVS_CMD} Threads

Dry Run Accelerators:
  stage: 'Syntax Check'
  needs: ['Create HIP Mock']
  script:
    - cp -r ${CI_PROJECT_DIR}/.gitlab/.pcvs ${CI_PROJECT_DIR}
    - ${PCVS_CMD} Accelerators

# NOTE: Impossible to fetch Quicksilver & Arcane submodules
Dry Run Applications:
  stage: 'Syntax Check'
  needs: ['Create HIP Mock']
  script:
    - cp -r ${CI_PROJECT_DIR}/.gitlab/.pcvs ${CI_PROJECT_DIR}
    - ${PCVS_CMD} Applications/Corals Applications/Mantevo

Dry Run Performance:
  stage: 'Syntax Check'
  needs: ['Create HIP Mock']
  script:
    - cp -r ${CI_PROJECT_DIR}/.gitlab/.pcvs ${CI_PROJECT_DIR}
    - ${PCVS_CMD} Performance

Dry Run Serial:
  stage: 'Syntax Check'
